<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML5 Game - Premium Edition</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #635bff;
      --accent-hover: #4b45c6;
      --text: #ffffff;
      --text-muted: #aaaaaa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      max-width: 380px;
      width: 100%;
    }

    h1, h3 { margin-top: 0; }
    p { color: var(--text-muted); font-size: 14px; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 10px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background-color: var(--accent-hover); }
    
    .btn-secondary { background-color: #333; }
    .btn-secondary:hover { background-color: #444; }

    .hidden { display: none !important; }

    canvas {
      border: 2px solid var(--accent);
      background: #000;
      margin-top: 15px;
      border-radius: 6px;
    }

    #status-message {
      font-size: 13px;
      margin-top: 10px;
      color: #00ff88;
    }
  </style>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <h1>HTML5 Game</h1>
    <div id="status-message"></div>

    <!-- VIEW 1: AUTHENTICATION -->
    <div id="view-auth">
      <h3>Welcome Back</h3>
      <input type="email" id="email-input" placeholder="Email Address" />
      <input type="password" id="password-input" placeholder="Password" />
      <button id="login-btn">Log In</button>
      <button id="signup-btn" class="btn-secondary">Create Account</button>
    </div>

    <!-- VIEW 2: PAYWALL / ACCESS LOCKED -->
    <div id="view-paywall" class="hidden">
      <h3>Access Locked</h3>
      <p>Unlock the full game experience with a single purchase.</p>
      <button id="buy-btn">Buy Game Access ($5)</button>
      <button id="logout-btn-1" class="btn-secondary">Log Out</button>
    </div>

    <!-- VIEW 3: GAME UNLOCKED -->
    <div id="view-game" class="hidden">
      <h3>Game Unlocked!</h3>
      <canvas id="gameCanvas" width="300" height="200"></canvas>
      <button id="logout-btn-2" class="btn-secondary">Log Out</button>
    </div>
  </div>

  <script>
    // Configuration Constants
    const SUPABASE_URL = 'https://fvwthzdxrysvehbrrfh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2d2ZoaXpkeHJ5c3ZlaGJycmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTA5MzgsImV4cCI6MjEwNzMyNjkzOH0.mX_XvyGVYT06_t-tURbPMq-hN8f-GE5aetA8ODER9P8';

    // Initialize Supabase Client safely
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elements Cache
    const views = {
      auth: document.getElementById('view-auth'),
      paywall: document.getElementById('view-paywall'),
      game: document.getElementById('view-game')
    };
    const statusMsg = document.getElementById('status-message');

    function switchView(viewName) {
      Object.keys(views).forEach(key => {
        if (key === viewName) {
          views[key].classList.remove('hidden');
        } else {
          views[key].classList.add('hidden');
        }
      });
    }

    function showStatus(text, isError = false) {
      statusMsg.style.color = isError ? '#ff4d4d' : '#00ff88';
      statusMsg.textContent = text;
      setTimeout(() => { statusMsg.textContent = ''; }, 5000);
    }

    // App Initialization on Page Load
    document.addEventListener('DOMContentLoaded', async () => {
      // Bind button events cleanly
      document.getElementById('login-btn').addEventListener('click', handleLogin);
      document.getElementById('signup-btn').addEventListener('click', handleSignUp);
      document.getElementById('buy-btn').addEventListener('click', handleBuyNow);
      document.getElementById('logout-btn-1').addEventListener('click', handleLogout);
      document.getElementById('logout-btn-2').addEventListener('click', handleLogout);

      // Check if redirected back from a successful Stripe purchase
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('success') === 'true') {
        showStatus('Payment successful! Verifying your access...');
        // Clean URL parameter
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      // Check active user session
      try {
        const { data: { session }, error } = await db.auth.getSession();
        if (error) throw error;

        if (session) {
          await verifyUserAccess(session.user);
        } else {
          switchView('auth');
        }
      } catch (err) {
        console.error("Initialization error:", err.message);
        switchView('auth');
      }
    });

    // Authentication Handlers
    async function handleSignUp() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showStatus('Please enter email and password.', true);
        return;
      }

      const { data, error } = await db.auth.signUp({ email, password });
      if (error) {
        showStatus(error.message, true);
      } else {
        showStatus('Account created! Check your email or log in.');
      }
    }

    async function handleLogin() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showStatus('Please enter email and password.', true);
        return;
      }

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        showStatus(error.message, true);
      } else {
        await verifyUserAccess(data.user);
      }
    }

    async function handleLogout() {
      await db.auth.signOut();
      switchView('auth');
      showStatus('Logged out successfully.');
    }

    // Database Permission Check
    async function verifyUserAccess(user) {
      showStatus('Checking access permissions...');

      // Query paid_users table. maybeSingle() prevents crashes if 0 rows return.
      const { data, error } = await db
        .from('paid_users')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (error) {
        console.error("Database check error:", error.message);
        showStatus('Error verifying access rights.', true);
        switchView('paywall');
        return;
      }

      if (data) {
        // User has paid -> Unlock Game
        switchView('game');
        startCanvasGame();
      } else {
        // User has not paid -> Show Paywall
        switchView('paywall');
      }
    }

    // Stripe Checkout Integration
    async function handleBuyNow() {
      try {
        const { data: { user } } = await db.auth.getUser();
        if (!user) {
          showStatus('Please log in first.', true);
          switchView('auth');
          return;
        }

        showStatus('Preparing secure checkout...');

        const response = await fetch(`${SUPABASE_URL}/functions/v1/create-checkout-session`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ userId: user.id })
        });

        const resData = await response.json();

        if (resData.url) {
          window.location.href = resData.url; // Redirect to Stripe
        } else {
          showStatus(resData.error || 'Failed to create checkout session.', true);
        }
      } catch (err) {
        console.error("Checkout request failed:", err);
        showStatus('Network error connecting to payment gateway.', true);
      }
    }

    // Simple Canvas Game Loop
    function startCanvasGame() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      
      let x = 50;
      let y = 100;
      let dx = 2;

      function draw() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw a simple moving object
        ctx.fillStyle = '#00ff88';
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.fillText('Game Running!', 100, 30);

        x += dx;
        if (x > canvas.width - 15 || x < 15) dx = -dx;

        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
